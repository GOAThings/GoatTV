# Projeto Xcode gerado pelo XcodeGen (`xcodegen generate`): o .xcodeproj não vai para o git.
name: GoatTV
options:
  bundleIdPrefix: cc.slokker
  deploymentTarget:
    # 18: o mínimo do AetherEngine (o motor experimental).
    tvOS: "18.0"
  createIntermediateGroups: true
packages:
  GoatCore:
    path: GoatCore
  # O motor experimental (LGPL-3.0 com exceção da App Store), numa versão fixa e sem as componentes opcionais (traits).
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.62.1
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "54"
targets:
  GoatTV:
    type: application
    platform: tvOS
    sources:
      - path: GoatTV
      - path: Shared
    dependencies:
      - package: GoatCore
      # O AetherEngine vai na sua framework (ver GoatAether/AetherPlayback.swift).
      - target: GoatAether
        embed: true
      # VLC para tvOS (LGPL): descarregado por scripts/fetch-vlckit.sh, não vai para o git.
      - framework: Frameworks/TVVLCKit.xcframework
        embed: true
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: VideoToolbox.framework
      - sdk: OpenGLES.framework
    info:
      path: GoatTV/Info.plist
      properties:
        CFBundleDisplayName: GoatTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        # goattv://play?playlist=…&channel=… abre um canal (os cartões da Top Shelf).
        CFBundleURLTypes:
          - CFBundleURLName: cc.slokker.goattv
            CFBundleURLSchemes: [goattv]
        # As listas IPTV são quase sempre http://.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # A porta 6471 (os canais para o GoatRemote, ver GoatTV/App/PhoneChannels.swift).
        NSLocalNetworkUsageDescription: GoatTV uses the local network so the GoatRemote phone app can show and change channels.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goattv
        PRODUCT_NAME: GoatTV
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
    scheme:
      testTargets: [GoatTVUITests]
  # O AetherEngine numa framework dinâmica: o FFmpeg dele fica separado do que o VLC traz dentro da app.
  GoatAether:
    type: framework
    platform: tvOS
    sources:
      - path: GoatAether
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goattv.aether
        PRODUCT_NAME: GoatAether
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Manual
  # Testes de interface no simulador (.github/workflows/ui-tests.yml): só em Debug, com a lista de UITests/Demo.
  GoatTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests/GoatTVUITests.swift
    dependencies:
      - target: GoatTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goattv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GoatTV
        CODE_SIGN_STYLE: Manual

# A app de iPhone (`xcodegen generate --spec iphone.yml`): o mesmo modelo e leitor da Apple TV, com ecrãs de toque.
name: GoatTVPhone
options:
  bundleIdPrefix: cc.slokker
  deploymentTarget:
    # 18: o mínimo do AetherEngine (o motor experimental).
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  GoatCore:
    path: GoatCore
  # O motor experimental (LGPL-3.0 com exceção da App Store), numa versão fixa e sem as componentes opcionais (traits).
  AetherEngine:
    url: https://github.com/superuser404notfound/AetherEngine
    exactVersion: 7.62.1
  # O FFmpeg do AetherEngine (as AetherLib*.framework dinâmicas): a mesma versão que ele resolve (3.14.x).
  FFmpegBuild:
    url: https://github.com/superuser404notfound/FFmpegBuild
    exactVersion: 3.14.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.14.1"
    CURRENT_PROJECT_VERSION: "60"
targets:
  GoatTV:
    type: application
    platform: iOS
    sources:
      - path: iPhone
      - path: Shared
      - path: GoatTV/Resources
      - path: GoatTV/Assets.xcassets
      - path: GoatTV/App
        excludes: [GoatTVApp.swift]
      - path: GoatTV/Player
      - path: GoatTV/UI/Strings.swift
      - path: GoatTV/UI/Translations.swift
      - path: GoatTV/UI/Theme.swift
      - path: GoatTV/UI/GoatLogo.swift
      - path: GoatTV/UI/ErrorPanel.swift
      - path: GoatTV/UI/PlayerParts.swift
      # A cápsula da TV (a voltar a ligar, deitado em ecrã inteiro) e o ícone da app (ver iPhone/PhoneNotices.swift).
      - path: GoatTV/UI/PlayerNotices.swift
      - path: GoatTV/UI/RootView.swift
    dependencies:
      # Com o núcleo partilhado com o Android lá dentro (GoatCore/Package.swift).
      - package: GoatCore
      # O AetherEngine vai na sua framework (ver GoatAether/AetherPlayback.swift).
      - target: GoatAether
        embed: true
      # A framework não leva lá dentro as do FFmpeg: a app é que as tem de levar (senão não abria).
      - package: FFmpegBuild
        products: [AetherLibavcodec, AetherLibavformat, AetherLibavutil, AetherLibswresample, AetherLibswscale,
                   AetherLibavfilter, AetherLibdav1d, AetherLibzimg, AetherLibzvbi]
      - framework: Frameworks/MobileVLCKit.xcframework
        embed: true
      - sdk: libc++.tbd
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libbz2.tbd
      - sdk: libiconv.tbd
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: VideoToolbox.framework
      - sdk: OpenGLES.framework
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: GoatTV
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: cc.slokker.goattv
            CFBundleURLSchemes: [goattv]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goattv.phone
        PRODUCT_NAME: GoatTV
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        CODE_SIGN_STYLE: Manual
  # O AetherEngine numa framework dinâmica: o FFmpeg dele fica separado do que o VLC traz dentro da app.
  GoatAether:
    type: framework
    platform: iOS
    sources:
      - path: GoatAether
    dependencies:
      - package: AetherEngine
        product: AetherEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.slokker.goattv.aether
        PRODUCT_NAME: GoatAether
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual

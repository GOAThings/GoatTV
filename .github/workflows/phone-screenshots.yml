name: Phone screenshots

# A interface de telemóvel num emulador, com a lista de demonstração (artefacto "phone-screenshots").
on:
  workflow_dispatch:
  push:
    branches: [mobile]

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build
        run: ./gradlew -q assembleDebug
      - name: Demo server
        run: |
          mkdir -p build/demo && cp -R tvos/UITests/Demo/. build/demo/
          python3 tvos/UITests/Demo/make-guide.py build/demo
          cd build/demo && nohup python3 -m http.server 8765 --bind 127.0.0.1 > ../http.log 2>&1 &
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -no-audio -gpu guest -no-snapshot
          script: bash .github/scripts/phone-screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: build/phone

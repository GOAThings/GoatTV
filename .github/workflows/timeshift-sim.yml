name: Apple TV timeshift

# Pausar o direto no simulador do Apple TV: um canal .ts ao vivo (gerado com o ffmpeg e dado ao ritmo real por
# tvos/UITests/Live/live-ts.py, que dá a volta ao ficheiro 12 s depois de o canal abrir: o relógio do emissor salta
# para trás, como quando um fornecedor reinicia o codificador), pausa, recua por cima desse salto, continua e volta ao
# direto (GoatTVUITests.testTimeshift); depois um HLS ao vivo (a janela do leitor da Apple) e um MP4 num endereço sem
# extensão (não é TS: o VLC abre-o diretamente). Confirma também que o "fornecedor" do .ts nunca vê mais do que uma
# ligação. À mão, ou nos ramos timeshift-* (um workflow novo só se
# pode lançar à mão depois de estar no main).
on:
  workflow_dispatch:
  push:
    branches: ["timeshift-*"]
    paths: ["tvos/**", ".github/workflows/timeshift-sim.yml"]

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 50
    defaults:
      run:
        working-directory: tvos
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: scripts/fetch-xcodegen.sh
      - uses: actions/cache@v4
        with:
          path: tvos/build/tvvlckit.tar.xz
          key: tvvlckit-3.7.4
      - name: TVVLCKit
        run: scripts/fetch-vlckit.sh
      - name: Gerar o projeto
        run: /tmp/xcodegen/xcodegen/bin/xcodegen generate --spec project.yml
      - name: Canal ao vivo
        run: |
          command -v ffmpeg || brew install ffmpeg > /dev/null
          mkdir -p build/live
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=960x540:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 120 -c:v libx264 -preset veryfast -g 50 -pix_fmt yuv420p -c:a aac -b:a 128k -f mpegts build/live/loop.ts
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=960x540:rate=25 -f lavfi -i sine=frequency=880:sample_rate=48000 \
            -t 30 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -movflags +faststart -f mp4 build/live/clip
          mkdir -p build/live/hls
          # O HLS ao vivo: o mesmo .ts em ciclo, ao ritmo real, numa janela de 10 bocados de 4 s.
          nohup ffmpeg -hide_banner -loglevel error -re -stream_loop -1 -i build/live/loop.ts -c copy -f hls -hls_time 4 \
            -hls_list_size 10 -hls_flags delete_segments build/live/hls/live.m3u8 > build/live/hls.log 2>&1 &
          ls -la build/live
          printf '#EXTM3U\n#EXTINF:-1 tvg-id="live" group-title="Live",Live TS\nhttp://127.0.0.1:8766/live.ts\n#EXTINF:-1 tvg-id="hls" group-title="Live",Live HLS\nhttp://127.0.0.1:8765/hls/live.m3u8\n#EXTINF:-1 tvg-id="mp4" group-title="Live",Clip MP4\nhttp://127.0.0.1:8765/clip\n' > build/live/live.m3u
          (cd build/live && nohup python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          nohup python3 UITests/Live/live-ts.py build/live/loop.ts 8766 build/live 120 12 > build/live/server.log 2>&1 &
      - name: Teste no simulador
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E 'Apple TV' | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulador: $SIM"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          nohup xcrun simctl spawn "$SIM" log stream --level info --style compact --predicate 'subsystem == "cc.slokker.goattv"' > build/app.log 2>&1 &
          TEST_RUNNER_TIMESHIFT_TEST=1 xcodebuild test -project GoatTV.xcodeproj -scheme GoatTV -configuration Debug \
            -destination "id=$SIM" -derivedDataPath build/dd -resultBundlePath build/timeshift.xcresult \
            -only-testing:GoatTVUITests/GoatTVUITests/testTimeshift CODE_SIGNING_ALLOWED=NO 2>&1 \
            | tee build/test.log | grep -E "error:|Test Case|XCTAssert|failed|skipped|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" build/test.log
      - name: Registo da app e ligações ao fornecedor
        if: always()
        run: |
          grep -E "Timeshift|Player" build/app.log | tail -120 || true
          # O MP4 passou pelo gravador, que viu que não era TS e o entregou ao VLC.
          grep -q "not a TS stream" build/app.log
          echo "--- servidor"
          cat build/live/server.log || true
          echo "--- máximo de ligações ao mesmo tempo: $(cat build/live/max-connections.txt)"
          test "$(cat build/live/max-connections.txt)" = 1
      - name: Screenshots
        if: always()
        run: |
          mkdir -p build/shots
          xcrun xcresulttool export attachments --path build/timeshift.xcresult --output-path build/shots || true
          ls build/shots | head -40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeshift-simulator
          path: |
            tvos/build/shots
            tvos/build/app.log
            tvos/build/test.log
            tvos/build/live/server.log
          retention-days: 14
